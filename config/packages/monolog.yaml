monolog:
    # Channels you want explicitly registered for special handling.
    # Here, "deprecation" is used for deprecation warnings from Symfony.
    channels:
        - deprecation # Enables the "deprecation" channel for deprecation notices.

# ==================================================
# DEV ENVIRONMENT LOGGING
# ==================================================
when@dev:
    monolog:
        handlers:
            main:
                # Main handler for DEV.
                # Logs to var/log/dev.log
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug               # Log all messages down to DEBUG level.
                channels: ["!event"]       # Exclude "event" channel messages.

            console:
                # Handler for CLI commands (`bin/console`).
                # Excludes "event" and "doctrine" channels to reduce noise.
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]

# ==================================================
# TEST ENVIRONMENT LOGGING
# ==================================================
when@test:
    monolog:
        channels:
            - debug

        handlers:
            test_stream:
                # Type of handler: 'stream' writes log entries to a file.
                type: stream

                # Path to the log file. This resolves to var/log/test.log.
                path: "%kernel.logs_dir%/%kernel.environment%.log"

                # Minimum log level to record. 'debug' captures everything: debug, info, notice, warning, error, critical, alert, emergency.
                level: debug

                # Channels to include or exclude.
                # By default, all channels are included.
                # Using '!event' to exclude verbose internal Symfony events.
                channels: ["!event"]


# ==================================================
# PROD ENVIRONMENT LOGGING
# ==================================================
when@prod:
    monolog:
        handlers:
            main:
                # Main handler for PROD.
                # Will only send messages when an error occurs.
                # Buffer the LAST 50 messages leading up to an error.
                # Excludes common status codes (404, 405).
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50           # Number of messages kept in memory.

            nested:
                # Final handler for PROD.
                # Writes messages as JSON to stderr.
                # Works well for container platforms like AWS, GCP, Kubernetes.
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json

            console:
                # Handler for the CLI.
                # Doesn’t duplicate messages for "event" or "doctrine".
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]

            deprecation:
                # Specific handler for deprecations.
                # Goes to stderr.
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecation.log"
